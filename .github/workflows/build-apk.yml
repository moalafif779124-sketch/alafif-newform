name: Build ALAFIF NEWFORM APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install deps
        run: flutter pub get

      - name: Analyze (errors only — legacy codebase has pre-existing warnings)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.p12
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APK (obfuscated)
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload AAB artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-aab
          path: build/app/outputs/bundle/release/*.aab
          compression-level: 9

      - name: Upload Dart symbols to Crashlytics
        # The release build is obfuscated (--obfuscate), so without this upload the
        # console shows unreadable stack traces. Not continue-on-error: a silent
        # failure here is exactly how crash reports looked "fine" while being useless.
        run: |
          APP_ID=$(python3 -c "import json;d=json.load(open('android/app/google-services.json'));print(d['client'][0]['client_info']['mobilesdk_app_id'])")
          echo "Crashlytics app id: $APP_ID"
          npx --yes firebase-tools@13 crashlytics:symbols:upload --app="$APP_ID" build/app/outputs/symbols
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Upload debug symbols
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/app/outputs/symbols
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alafif-newform-apk
          path: build/app/outputs/flutter-apk/*.apk
          compression-level: 9

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # flutter build apk --target-platform android-arm64 (no --split-per-abi) names the file app-release.apk
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          ls -lh build/app/outputs/flutter-apk/
          echo "Uploading $APK as app-arm64-v8a-release.apk"
          cp "$APK" /tmp/app-arm64-v8a-release.apk
          gh release upload jeeb-v1 /tmp/app-arm64-v8a-release.apk --clobber
          echo "--- release assets after upload ---"
          gh release view jeeb-v1 --json assets --jq '.assets[] | "\(.name)  \(.updatedAt)  \(.size)"'

      - name: Show outputs
        run: |
          echo "Build complete!"
          ls -lh build/app/outputs/flutter-apk/

      # Storage is NOT provisioned on this project (no bucket) — adding
      # storage:rules aborts the whole deploy with "Firebase Storage has not
      # been set up", which silently blocked firestore.rules from ever
      # publishing. Deploy Firestore only, and let failures go red.
      - name: Deploy Firestore rules + indexes
        uses: w9jds/firebase-action@v15.23.0
        with:
          args: deploy --only firestore:rules,firestore:indexes --project alafif-newform
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Functions deps
        continue-on-error: true
        working-directory: ./functions
        run: npm install --omit=dev
        env:
          NODE_ENV: production

      - name: Deploy Cloud Functions
        continue-on-error: true
        uses: w9jds/firebase-action@v15.23.0
        with:
          args: deploy --only functions --project alafif-newform
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
