name: Export Keystore (temp)
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write keystore base64 to file
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore_base64.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-export
          path: keystore_base64.txt
          retention-days: 1
